name: Multi-Platform Release Build (v1.2.10)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'common/**'
      - 'sysmodule/**'
      - 'overlay/**'
      - 'desktop_src/**'
      - 'desktop_deps/**'
      - 'Makefile'
      - 'Makefile.desktop'
      - '.github/workflows/multiplatform.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msysystem: mingw64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Build Sirene Windows x64 (C++17)
        shell: msys2 {0}
        run: |
          windres desktop_src/sirene.rc -O coff -o desktop_src/sirene_res.o
          for f in src/audio.c src/decode.c src/draw.c src/draw_text.c src/lrc.c src/meta.c src/util.c desktop_src/desktop_lua.c; do
            gcc -O3 -fno-math-errno -Wall -Wextra -Isrc -Ideps -Idesktop_deps/lua -Idesktop_deps/qr -c "$f" -o "${f%.c}.o"
          done
          gcc -c desktop_src/desktop_blobs.S -o desktop_src/desktop_blobs.o
          g++ -std=c++17 -O3 -fno-math-errno -Wall -Wextra -Isrc -Ideps -Idesktop_deps/lua -Idesktop_deps/qr -c desktop_src/desktop_main.cpp -o desktop_src/desktop_main.o
          g++ -std=c++17 -O3 -fno-math-errno -Wall -Wextra -Isrc -Ideps -Idesktop_deps/lua -Idesktop_deps/qr -c desktop_src/desktop_plugin.cpp -o desktop_src/desktop_plugin.o
          g++ -std=c++17 -O3 -fno-math-errno -Wall -Wextra -Isrc -Ideps -Idesktop_deps/lua -Idesktop_deps/qr -c desktop_src/desktop_win.cpp -o desktop_src/desktop_win.o
          g++ src/audio.o src/decode.o src/draw.o src/draw_text.o src/lrc.o src/meta.o src/util.o \
            desktop_src/desktop_lua.o desktop_src/desktop_main.o desktop_src/desktop_plugin.o desktop_src/desktop_win.o desktop_src/desktop_blobs.o desktop_src/sirene_res.o \
            -o Sirene-v1.2.10-Windows-x64.exe \
            -static -static-libgcc -static-libstdc++ -mwindows -lgdi32 -luser32 -lshell32 -lole32 -lcomdlg32 -lwinmm -luuid -lm
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: Sirene-v1.2.10-Windows-x64.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev pkg-config
      - name: Build Sirene Linux x86_64
        run: |
          make -f Makefile.desktop
          ldd Sirene
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./Sirene &
          SPID=$!
          sleep 1
          kill -0 "$SPID"
          kill -TERM "$SPID"
          wait "$SPID" || true
          mkdir -p dist-linux
          cp Sirene icon.jpg README.md dist-linux/
          tar -czvf Sirene-v1.2.10-Linux-x86_64.tar.gz -C dist-linux .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: Sirene-v1.2.10-Linux-x86_64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 via Homebrew
        run: |
          brew install sdl2 pkg-config dylibbundler
      - name: Build Sirene macOS App
        run: |
          make -f Makefile.desktop macos-app
          dylibbundler -od -b -x Sirène.app/Contents/MacOS/Sirene -d Sirène.app/Contents/Frameworks/ -p @executable_path/../Frameworks/
          SDL3_LIB="$(brew --prefix sdl3 2>/dev/null)/lib/libSDL3.0.dylib"
          if [ -f "$SDL3_LIB" ]; then
            cp -L "$SDL3_LIB" Sirène.app/Contents/Frameworks/libSDL3.0.dylib
            chmod 755 Sirène.app/Contents/Frameworks/libSDL3.0.dylib
            install_name_tool -id "@executable_path/../Frameworks/libSDL3.0.dylib" Sirène.app/Contents/Frameworks/libSDL3.0.dylib
            ln -sf libSDL3.0.dylib Sirène.app/Contents/Frameworks/libSDL3.dylib
          fi
          codesign --force --deep --sign - Sirène.app
          otool -L Sirène.app/Contents/MacOS/Sirene Sirène.app/Contents/Frameworks/libSDL2-2.0.0.dylib
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./Sirène.app/Contents/MacOS/Sirene &
          SPID=$!
          sleep 1
          kill -0 "$SPID"
          kill -TERM "$SPID"
          wait "$SPID" || true
          zip -ry Sirene-v1.2.10-macOS-arm64.zip Sirène.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: Sirene-v1.2.10-macOS-arm64.zip

  build-switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: masagrator/libtesla
          ref: add38a6
          path: overlay/libs/libtesla
      - name: Build Sirene NRO + sys-sirene + Tesla Overlay (Open-Source Homebrew)
        run: |
          source /etc/profile.d/devkit-env.sh || true
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export PATH="$DEVKITPRO/tools/bin:$DEVKITPRO/devkitA64/bin:$PATH"

          # 1. Main .nro player
          make clean && make -j$(nproc)
          mv PureMusic.nro Sirene-v1.2.10-Switch.nro

          # 2. Background audio sysmodule (sys-sirene -> exefs.nsp)
          make -C sysmodule clean && make -C sysmodule -j$(nproc)

          # 3. Tesla in-game overlay (SireneOverlay.ovl)
          make -C overlay clean && make -C overlay -j$(nproc)

          # 4. Assemble SD-card-ready Homebrew bundle
          rm -rf dist-homebrew
          mkdir -p dist-homebrew/atmosphere/contents/4200000000051234/flags
          mkdir -p dist-homebrew/switch/Sirene
          mkdir -p dist-homebrew/switch/.overlays
          cp sysmodule/sys-sirene.nsp dist-homebrew/atmosphere/contents/4200000000051234/exefs.nsp
          cp sysmodule/toolbox.json dist-homebrew/atmosphere/contents/4200000000051234/toolbox.json
          touch dist-homebrew/atmosphere/contents/4200000000051234/flags/boot2.flag
          cp Sirene-v1.2.10-Switch.nro dist-homebrew/switch/Sirene/Sirene.nro
          cp overlay/SireneOverlay.ovl dist-homebrew/switch/.overlays/SireneOverlay.ovl
          cp README.md DISCLAIMER.md dist-homebrew/switch/Sirene/
          if command -v zip >/dev/null 2>&1; then
            (cd dist-homebrew && zip -r ../Sirene-v1.2.10-Homebrew-Full.zip .)
          else
            python3 -c "import os, zipfile; z=zipfile.ZipFile('Sirene-v1.2.10-Homebrew-Full.zip','w',zipfile.ZIP_DEFLATED); [z.write(os.path.join(r,f), os.path.relpath(os.path.join(r,f),'dist-homebrew')) for r,_,fs in os.walk('dist-homebrew') for f in fs]; z.close()"
          fi
          ls -lh Sirene-v1.2.10-Switch.nro sysmodule/sys-sirene.nsp overlay/SireneOverlay.ovl Sirene-v1.2.10-Homebrew-Full.zip
      - uses: actions/upload-artifact@v4
        with:
          name: switch-nro
          path: |
            Sirene-v1.2.10-Switch.nro
            Sirene-v1.2.10-Homebrew-Full.zip

  publish-to-release:
    needs: [ build-windows, build-linux, build-macos, build-switch ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload all platform packages to Release v1.2.10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<'EOF'
          Sirène v1.2.10 开源掌机音乐播放器（Homebrew `.nro` + `sys-sirene` 后台播放插件 + Tesla 游戏内浮层 `.ovl` + 桌面伴生版）。

          ### v1.2.10 核心更新
          - **新增后台听歌插件套件（`Sirene-v1.2.10-Homebrew-Full.zip`）**：
            - **`sys-sirene` 极轻量后台音频模块**（TID `4200000000051234`，2 MiB 静态堆，纯 `libnx` + `audout` 流式解码，支持 FLAC / MP3 / WAV / OGG / AIFF）；
            - **`Sirène.nro` 无缝前后台接力**：退出时一键「后台继续听」移交当前曲目、进度与歌单，重新打开主程序自动接管同步歌词；
            - **`SireneOverlay.ovl` Tesla 浮层**：游戏中随时呼出切歌、播放/暂停、调音量、切换循环模式与浏览曲库。
          - **桌面端伴生构建**：同步保留 Windows / Linux / macOS 三端 C++17 原生构建产物。

          > **独立开源与合规声明**：本项目基于 `devkitA64` / `libnx` / `dr_libs` / `stb` 等公开开源工具链从零编写，不含任何官方闭源 SDK、密钥或系统绕过机制，与任何硬件/游戏机制造商无官方关联，不提供任何受版权保护音频资源。下载与运行风险均由使用者自行承担（详见 `DISCLAIMER.md`）。
          EOF
          )
          NOTES="$(printf '%s' "$NOTES" | sed 's/^          //')"
          if ! gh release view v1.2.10 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create v1.2.10 --repo "${{ github.repository }}" --title "Sirène v1.2.10 (Homebrew .nro + Background Audio Plugin)" --notes "$NOTES"
          else
            gh release edit v1.2.10 --repo "${{ github.repository }}" --notes "$NOTES"
          fi
          gh release upload v1.2.10 \
            artifacts/windows-x64/Sirene-v1.2.10-Windows-x64.exe \
            artifacts/linux-x86_64/Sirene-v1.2.10-Linux-x86_64.tar.gz \
            artifacts/macos-arm64/Sirene-v1.2.10-macOS-arm64.zip \
            artifacts/switch-nro/Sirene-v1.2.10-Switch.nro \
            artifacts/switch-nro/Sirene-v1.2.10-Homebrew-Full.zip \
            --repo "${{ github.repository }}" \
            --clobber
