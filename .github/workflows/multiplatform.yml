name: Multi-Platform Release Build (v1.2.6)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'desktop_src/**'
      - 'Makefile.desktop'
      - '.github/workflows/multiplatform.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msysystem: mingw64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Build Sirene Windows x64
        shell: msys2 {0}
        run: |
          windres desktop_src/sirene.rc -O coff -o desktop_src/sirene_res.o
          gcc -O3 -fno-math-errno -Wall -Wextra -Isrc -Ideps \
            src/audio.c src/decode.c src/draw.c src/draw_text.c \
            src/lrc.c src/main.c src/meta.c src/util.c \
            desktop_src/desktop_win.c desktop_src/desktop_blobs.S desktop_src/sirene_res.o \
            -o Sirene-v1.2.6-Windows-x64.exe \
            -mwindows -lgdi32 -luser32 -lshell32 -lole32 -lcomdlg32 -lwinmm -luuid -lm
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: Sirene-v1.2.6-Windows-x64.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev pkg-config
      - name: Build Sirene Linux x86_64
        run: |
          make -f Makefile.desktop
          ldd Sirene
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./Sirene &
          SPID=$!
          sleep 1
          kill -0 "$SPID"
          kill -TERM "$SPID"
          wait "$SPID" || true
          mkdir -p dist-linux
          cp Sirene icon.jpg README.md dist-linux/
          tar -czvf Sirene-v1.2.6-Linux-x86_64.tar.gz -C dist-linux .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: Sirene-v1.2.6-Linux-x86_64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 via Homebrew
        run: |
          brew install sdl2 pkg-config dylibbundler
      - name: Build Sirene macOS App
        run: |
          make -f Makefile.desktop macos-app
          dylibbundler -od -b -x Sirène.app/Contents/MacOS/Sirene -d Sirène.app/Contents/Frameworks/ -p @executable_path/../Frameworks/
          SDL3_LIB="$(brew --prefix sdl3 2>/dev/null)/lib/libSDL3.0.dylib"
          if [ -f "$SDL3_LIB" ]; then
            cp -L "$SDL3_LIB" Sirène.app/Contents/Frameworks/libSDL3.0.dylib
            chmod 755 Sirène.app/Contents/Frameworks/libSDL3.0.dylib
            install_name_tool -id "@executable_path/../Frameworks/libSDL3.0.dylib" Sirène.app/Contents/Frameworks/libSDL3.0.dylib
            ln -sf libSDL3.0.dylib Sirène.app/Contents/Frameworks/libSDL3.dylib
          fi
          codesign --force --deep --sign - Sirène.app
          otool -L Sirène.app/Contents/MacOS/Sirene Sirène.app/Contents/Frameworks/libSDL2-2.0.0.dylib
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./Sirène.app/Contents/MacOS/Sirene &
          SPID=$!
          sleep 1
          kill -0 "$SPID"
          kill -TERM "$SPID"
          wait "$SPID" || true
          zip -ry Sirene-v1.2.6-macOS-arm64.zip Sirène.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: Sirene-v1.2.6-macOS-arm64.zip

  publish-to-release:
    needs: [ build-windows, build-linux, build-macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload desktop packages to Release v1.2.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.2.6 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create v1.2.6 --repo "${{ github.repository }}" --title "Sirène v1.2.6 (HiDPI Crisp UI · Online Lyrics · Smooth Scrubbing · Multi-Format)" --notes "Sirène v1.2.6 Multi-Platform Release"
          fi
          gh release upload v1.2.6 \
            artifacts/windows-x64/Sirene-v1.2.6-Windows-x64.exe \
            artifacts/linux-x86_64/Sirene-v1.2.6-Linux-x86_64.tar.gz \
            artifacts/macos-arm64/Sirene-v1.2.6-macOS-arm64.zip \
            --repo "${{ github.repository }}" \
            --clobber
